name: cws
description: "Car Care MIS"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.0.0
  get: ^4.7.2
  shared_preferences: ^2.5.3
  get_it: ^8.1.0
