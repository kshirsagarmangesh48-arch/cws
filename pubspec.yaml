  go_router: ^16.0.0
  lottie: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1

dev_dependencies:
